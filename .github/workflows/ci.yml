name: CI

# Control de cambios — verificación automática.
# Se ejecuta en cada pull request y en cada push a main.
# Objetivo: que ningún cambio llegue a main sin compilar y pasar el lint.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancela ejecuciones anteriores del mismo PR cuando se sube un cambio nuevo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Compilar y lint
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compilar (type-check + build)
        run: npm run build
